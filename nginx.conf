server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # bangs.bin is stored brotli-compressed at build time (see
    # src/build-workers.ts); _headers only applies on Cloudflare Pages,
    # so nginx has to set Content-Encoding itself.
    location = /bangs.bin {
        default_type application/octet-stream;
        add_header Content-Encoding br always;
        add_header Cache-Control "public, no-cache, no-transform" always;
    }

    location = /sw.js {
        add_header Cache-Control "public, no-cache" always;
    }

    location = /fallback.js {
        add_header Cache-Control "public, no-cache" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(opus|svg|gif)$ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        add_header Cache-Control "public, no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
